name: tab_generator
description: "A Flutter tab generator app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dart_midi_pro: ^1.0.4+2
  flutter_midi_pro: ^2.0.1
